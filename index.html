<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #00ff41;
      --dim:   #00c835;
      --dark:  #00902b;
      --bg:    #0a0e0a;
      --panel: #0d1117;
      --cyan:  #00e5ff;
      --amber: #ffb800;
      --red:   #ff4a4a;
      --white: #c9d1d9;
      --font:  'Courier New', 'Fira Code', 'JetBrains Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--green);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Scanline overlay ─────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.15) 0px,
        rgba(0,0,0,0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── CRT flicker ──────────────────────────────── */
    @keyframes flicker {
      0%   { opacity: .97; }
      5%   { opacity: 1;   }
      10%  { opacity: .98; }
      15%  { opacity: 1;   }
      50%  { opacity: .96; }
      80%  { opacity: 1;   }
      100% { opacity: .99; }
    }

    /* ── Layout ───────────────────────────────────── */
    .wrapper {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      animation: flicker 4s infinite alternate;
    }

    /* ── Terminal header bar ──────────────────────── */
    .titlebar {
      background: #1e2229;
      border-radius: 10px 10px 0 0;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--white);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.r { background: #ff5f56; }
    .dot.y { background: #ffbd2e; }
    .dot.g { background: #27c93f; }
    .titlebar span { margin-left: 14px; opacity: .7; }

    /* ── Terminal body ────────────────────────────── */
    .terminal {
      background: var(--panel);
      border-radius: 0 0 10px 10px;
      padding: 24px 28px 32px;
      box-shadow: 0 0 60px rgba(0,255,65,.06);
    }

    /* ── Welcome block ────────────────────────────── */
    .welcome {
      white-space: pre-wrap;
      color: var(--dim);
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.5;
    }
    .welcome strong { color: var(--cyan); }

    /* ── Output lines ─────────────────────────────── */
    .output { margin-bottom: 8px; }
    .output pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cmd-line {
      display: flex;
      align-items: center;
      gap: 0;
      margin-top: 14px;
    }
    .prompt {
      color: var(--cyan);
      white-space: nowrap;
      font-weight: bold;
      user-select: none;
    }
    #input {
      background: transparent;
      border: none;
      color: var(--green);
      font-family: var(--font);
      font-size: 15px;
      flex: 1;
      outline: none;
      caret-color: var(--green);
      margin-left: 2px;
    }

    /* ── Blinking cursor for typed text ───────────── */
    .cursor {
      display: inline-block;
      width: 9px;
      height: 17px;
      background: var(--green);
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0; } }

    /* ── Command helpers ──────────────────────────── */
    .header-text {
      color: var(--cyan);
      font-weight: bold;
      margin-bottom: 4px;
    }
    .section-title {
      color: var(--amber);
      font-weight: bold;
      margin: 18px 0 6px;
      border-bottom: 1px dashed var(--dark);
      padding-bottom: 3px;
    }
    .link { color: var(--cyan); text-decoration: underline; cursor: pointer; }
    .link:hover { color: #fff; }
    .tag {
      display: inline-block;
      background: rgba(0,255,65,.1);
      border: 1px solid var(--dark);
      border-radius: 4px;
      padding: 1px 8px;
      margin: 2px 4px 2px 0;
      font-size: 13px;
      color: var(--dim);
    }
    .highlight { color: var(--green); font-weight: bold; }
    .muted    { color: #5a6d5e; }
    .date     { color: #7e9084; float: right; }

    /* ── Projects grid ────────────────────────────── */
    .proj-card {
      border-left: 3px solid var(--dark);
      padding: 6px 12px;
      margin: 8px 0;
      transition: border-color .2s, background .2s;
    }
    .proj-card:hover {
      border-color: var(--green);
      background: rgba(0,255,65,.03);
    }
    .proj-card .name { color: var(--cyan); font-weight: bold; font-size: 15px; }
    .proj-card p   { color: var(--white); margin-top: 2px; }

    /* ── Experience ───────────────────────────────── */
    .exp-block { margin: 10px 0; padding-left: 14px; border-left: 2px solid var(--dark); }
    .exp-title { color: var(--amber); font-weight: bold; }
    .exp-company { color: var(--cyan); }
    .exp-desc  { color: var(--white); margin-top: 3px; }

    /* ── Skills columns ───────────────────────────── */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 4px 24px;
      margin-top: 6px;
    }
    .skill-cat { color: var(--amber); font-weight: bold; margin-bottom: 2px; }

    /* ── Help list ────────────────────────────────── */
    .help-list { margin-top: 4px; }
    .help-item { display: flex; gap: 12px; }
    .help-cmd  { color: var(--amber); min-width: 100px; font-weight: bold; }
    .help-desc { color: var(--white); }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 600px) {
      .wrapper { padding: 12px 8px 40px; }
      .terminal { padding: 16px 14px 24px; }
      body { font-size: 13px; }
      .welcome { font-size: 11px; }
    }

    /* ── Print hidden scanlines ───────────────────── */
    @media print { body::after { display: none; } }
  </style>
</head>

/* ──────────────── HELPERS ───────────────────────── */
const output    = document.getElementById('output');
const inputEl   = document.getElementById('input');
const welcomeEl = document.getElementById('welcome');
const promptEl  = document.getElementById('promptText');

// Command history (Up/Down arrows)
const history = [];
let histIdx = -1;

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function append(html) { output.insertAdjacentHTML('beforeend', html); }

function scrollToBottom() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

/* ──────────── EXECUTE COMMAND ───────────────────── */
function runCmd(cmd) {
  const raw = cmd.trim();

  if (raw === '') return;

  // Push to history (deduplicate consecutive same commands)
  if (history.length === 0 || history[history.length - 1] !== raw) {
    history.push(raw);
  }
  histIdx = history.length; // point past the end

  const key = raw.toLowerCase();
  const safeCmd = esc(raw);

  // Echo the command
  append(`<div class="output"><span style="color:var(--cyan)">┌──(vansh㉿portfolio)-[~]</span>\n<span style="color:var(--green)">$ ${safeCmd}</span></div>`);

  if (COMMANDS[key]) {
    append(`<div class="output">${COMMANDS[key]}</div>`);
  } else if (key === 'clear') {
    output.innerHTML = '';
  } else {
    append(`<div class="output"><span style="color:var(--red)">bash: ${safeCmd}: command not found. Type <span style="color:var(--amber)">help</span> for available commands.</span></div>`);
    return;
  }

  scrollToBottom();
}

/* ──────────── EVENT LISTENERS ───────────────────── */
inputEl.addEventListener('keydown', e => {
  // Command history
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; inputEl.value = history[histIdx]; }
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; inputEl.value = history[histIdx]; }
    else { histIdx = history.length; inputEl.value = ''; }
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    runCmd(inputEl.value);
    inputEl.value = '';
    // Update prompt after command
    updatePrompt('');
    return;
  }
});

document.addEventListener('click', () => inputEl.focus());

// Interactive prompt — updates based on current section
function updatePrompt(cmd) {
  const base = 'vansh㉿portfolio';
  let path = '~';
  if (cmd.toLowerCase() === 'projects') path = '~/projects';
  else if (cmd.toLowerCase() === 'experience') path = '~/work';
  else if (cmd.toLowerCase() === 'skills') path = '~/skills';
  else if (cmd.toLowerCase() === 'contact') path = '~/contact';
  promptEl.textContent = cmd ? `┌──(${base})-[${path}]` : `┌──(${base})-[${path}]-`;
}

inputEl.addEventListener('input', e => updatePrompt(e.target.value));

╚═╝     ╚══════╝╚═╝  ╚═╝╚═════╝ ╚═╝╚══════╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝╚══════╝`;

(async function boot() {

  welcomeEl.innerHTML = WELCOME.trim().split('\n').map(line => `${esc(line)}<br>`).join('');

  let cursorVisible = true;

    inputEl.style.caretColor = cursorVisible ? 'var(--green)' : 'transparent';
    cursorVisible = !cursorVisible;
  }, 530);
})();
